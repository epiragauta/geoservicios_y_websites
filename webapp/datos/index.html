<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorador de datos geograficos</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --border:#cccccc; --text:#000000;
    --muted:#555555; --accent:#000000; --accent-soft:#f2f2f2; --hover:#f2f2f2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:20px 24px;
    position:sticky;top:0;z-index:10}
  h1{margin:0 0 4px;font-size:1.4rem}
  .sub{color:var(--muted);font-size:.9rem}
  .stats{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
  .stat{background:var(--accent-soft);border-radius:8px;padding:8px 14px;font-size:.85rem}
  .stat b{display:block;font-size:1.25rem;color:var(--accent)}
  .toolbar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
  #search{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--text);font-size:.95rem}
  .btn{padding:9px 14px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:.85rem}
  .btn:hover{background:var(--hover)}
  main{max-width:1000px;margin:0 auto;padding:20px 24px 60px}
  details{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;
    overflow:hidden}
  summary{cursor:pointer;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;
    align-items:center;list-style:none;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary:hover{background:var(--hover)}
  .dep-code{color:var(--text);font-family:ui-monospace,monospace;margin-right:8px}
  .count{color:var(--muted);font-weight:400;font-size:.85rem}
  .files{border-top:1px solid var(--border)}
  .file{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:9px 16px 9px 28px;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text)}
  .file:last-child{border-bottom:none}
  .file:hover{background:var(--hover)}
  .file .nm{display:flex;align-items:center;gap:10px;min-width:0}
  .ico{font-size:1.1rem;flex-shrink:0;filter:grayscale(1)}
  .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .size{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;flex-shrink:0}
  .size.big{color:var(--text);font-weight:700}
  .root-files{margin-bottom:18px}
  .hidden{display:none !important}
  .empty{color:var(--muted);text-align:center;padding:40px}
  footer{color:var(--muted);font-size:.8rem;text-align:center;padding:20px}
  a.plain{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>Explorador de datos geograficos</h1>
  <div class="sub">Capas GeoJSON recortadas por departamento &middot; <a class="plain" href="../index.html">&larr; Volver al visor</a></div>
  <div class="stats">
    <div class="stat"><b>33</b>departamentos</div>
    <div class="stat"><b>328</b>archivos</div>
    <div class="stat"><b>473 MB</b>tama&ntilde;o total</div>
  </div>
  <div class="toolbar">
    <input id="search" type="text" placeholder="Buscar por departamento o nombre de capa..." autocomplete="off">
    <button class="btn" id="expand">Expandir todo</button>
    <button class="btn" id="collapse">Colapsar todo</button>
  </div>
</header>
<main>
  <div class="root-files" id="rootFiles"></div>
  <div id="tree"></div>
  <div class="empty hidden" id="empty">No hay coincidencias.</div>
</main>
<footer>Generado estaticamente &middot; los enlaces abren el GeoJSON en el navegador.</footer>

function fmtSize(b){
  if(b >= 1048576) return (b/1048576).toFixed(1)+' MB';
  if(b >= 1024) return (b/1024).toFixed(0)+' KB';
  return b+' B';
}
function iconFor(name){
  const n = name.toLowerCase();
  if(n.endsWith('.csv')) return '📄';
  if(n.includes('via')) return '🛣️';
  if(n.includes('drenaje')||n.includes('laguna')||n.includes('cienaga')||n.includes('madrevieja')||n.includes('pantano')||n.includes('raudal')||n.includes('costero')) return '💧';
  if(n.includes('bosque')||n.includes('manglar')) return '🌳';
  if(n.includes('curva')||n.includes('orografia')||n.includes('banco')) return '⛰️';
  if(n.includes('construccion')||n.includes('puente')||n.includes('puerto')||n.includes('aeropuerto')) return '🏗️';
  if(n.includes('administrativo')||n.includes('limite')||n.includes('hito')||n.includes('manzana')) return '🏛️';
  if(n.includes('isla')) return '🏝️';
  return '🗺️';
}
function depLabel(dir){
  const m = dir.match(/^(d+)_(.+)$/);
  if(!m) return {code:'', name:dir.replace(/_/g,' ')};
  return {code:m[1], name:m[2].replace(/_/g,' ')};
}

  a.dataset.name=f.name.toLowerCase();
  a.innerHTML='<span class="nm"><span class="ico">'+iconFor(f.name)+'</span><span class="fname">'+f.name+'</span></span>'+
    '<span class="size'+(f.size>1048576?' big':'')+'">'+fmtSize(f.size)+'</span>';
  rootEl.appendChild(a);
});

const treeEl = document.getElementById('tree');
TREE.dirs.forEach(d=>{
  const lbl = depLabel(d.name);
  const det = document.createElement('details');
  det.dataset.dep=(lbl.code+' '+lbl.name).toLowerCase();
  const sum = document.createElement('summary');
  sum.innerHTML='<span><span class="dep-code">'+lbl.code+'</span>'+lbl.name+'</span>'+
    '<span class="count">'+d.files.length+' capas</span>';
  det.appendChild(sum);
  const fl = document.createElement('div'); fl.className='files';
  d.files.forEach(f=>{
    const a=document.createElement('a');
    a.className='file'; a.href=encodeURIComponent(d.name)+'/'+encodeURIComponent(f.name);
    a.target='_blank'; a.rel='noopener'; a.dataset.name=f.name.toLowerCase();
    a.innerHTML='<span class="nm"><span class="ico">'+iconFor(f.name)+'</span><span class="fname">'+f.name+'</span></span>'+
      '<span class="size'+(f.size>1048576?' big':'')+'">'+fmtSize(f.size)+'</span>';
    fl.appendChild(a);
  });
  det.appendChild(fl);
  treeEl.appendChild(det);
});

const search=document.getElementById('search');
const empty=document.getElementById('empty');
search.addEventListener('input',()=>{
  const q=search.value.trim().toLowerCase();
  let anyVisible=false;
  treeEl.querySelectorAll('details').forEach(det=>{
    const depMatch=!q || det.dataset.dep.includes(q);
    let fileMatches=0;
    det.querySelectorAll('.file').forEach(a=>{
      const show=!q || depMatch || a.dataset.name.includes(q);
      a.classList.toggle('hidden',!show);
      if(show) fileMatches++;
    });
    const visible = depMatch || fileMatches>0;
    det.classList.toggle('hidden',!visible);
    if(visible){anyVisible=true; if(q) det.open=true;}
  });
  rootEl.querySelectorAll('.file').forEach(a=>{
    a.classList.toggle('hidden', !!q && !a.dataset.name.includes(q));
  });
  empty.classList.toggle('hidden',anyVisible);
});
document.getElementById('expand').onclick=()=>treeEl.querySelectorAll('details').forEach(d=>d.open=true);
document.getElementById('collapse').onclick=()=>treeEl.querySelectorAll('details').forEach(d=>d.open=false);
</script>
</body>
</html>
